<!doctype html>
<meta charset="utf-8">
<title>SC 跑商路线 · 多角闭环检索</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#0e1116; color:#e6edf3; }
  header { padding:20px 28px; border-bottom:1px solid #232c38; }
  header h1 { margin:0; font-size:18px; color:#f0b429; font-weight:600; }
  header p { margin:6px 0 0; font-size:12.5px; color:#7d8b9b; }
  .wrap { display:flex; gap:24px; padding:24px 28px 40px; align-items:flex-start; }
  form { width:330px; flex:none; background:#151b23; border:1px solid #232c38; border-radius:10px; padding:18px; }
  .row { margin-bottom:14px; }
  label { display:block; font-size:12px; color:#9fb0c3; margin-bottom:5px; }
  select, input[type=number] { width:100%; box-sizing:border-box; background:#0e1116; color:#e6edf3; border:1px solid #2a3441; border-radius:6px; padding:8px 10px; font-size:13px; }
  .checks { display:flex; flex-direction:column; gap:8px; }
  .checks label { display:flex; align-items:center; gap:7px; color:#c9d6e3; font-size:12.5px; margin:0; cursor:pointer; }
  input[type=checkbox] { width:15px; height:15px; accent-color:#f0b429; }
  button { width:100%; margin-top:6px; background:#f0b429; color:#1a1206; border:0; border-radius:6px; padding:10px; font-size:13.5px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .hint { font-size:11px; color:#6b7a8c; margin-top:8px; line-height:1.6; }
  main { flex:1; min-width:0; }
  .status { font-size:13px; color:#9fb0c3; margin-bottom:12px; }
  .status.err { color:#f85149; }
  .card { background:#151b23; border:1px solid #232c38; border-radius:10px; padding:14px; }
  img { max-width:100%; height:auto; border-radius:8px; display:block; }
  .meta { font-size:12px; color:#7d8b9b; margin-bottom:10px; }
  .md { display:none; margin-top:14px; white-space:pre-wrap; font-size:11.5px; color:#9fb0c3; background:#0e1116; border:1px solid #232c38; border-radius:8px; padding:12px; max-height:320px; overflow:auto; }
  .toggle { margin-top:10px; font-size:12px; color:#58a6ff; cursor:pointer; }
</style>
<header>
  <h1>SC 跑商路线 · 多角闭环检索</h1>
  <p>选船 / 预算 / 角数 → 搜 Stanton 等星系的空间站闭环，输出带耗时分解的路线图</p>
</header>
<div class="wrap">
  <form id="f">
    <div class="row">
      <label for="ship">船型</label>
      <select id="ship"></select>
    </div>
    <div class="row">
      <label for="budget">预算 (aUEC)</label>
      <input type="number" id="budget" step="100000" min="0">
    </div>
    <div class="row">
      <label for="stops">角数（2=来回，3=三角…）</label>
      <select id="stops">
        <option>2</option><option>3</option><option selected>5</option><option>6</option>
      </select>
    </div>
    <div class="row">
      <label for="system">星系</label>
      <select id="system"></select>
    </div>
    <div class="row checks">
      <label><input type="checkbox" id="mixed" checked> 混装填满货舱</label>
      <label><input type="checkbox" id="auto" checked> 仅自动装载站点</label>
    </div>
    <div class="row">
      <label for="scale">图片分辨率</label>
      <select id="scale">
        <option value="2">2x</option>
        <option value="3">3x</option>
        <option value="4" selected>4x</option>
      </select>
    </div>
    <button id="go" type="submit">检索路线</button>
    <div class="hint">首次检索要拉一次全市场价（约 20 秒）；相同参数会命中缓存。</div>
  </form>

  <main>
    <div class="status" id="status">载入船型…</div>
    <div class="card" id="card" style="display:none">
      <div class="meta" id="meta"></div>
      <img id="img" alt="路线图">
      <div class="toggle" id="toggle">显示 Markdown 表格</div>
      <pre class="md" id="md"></pre>
    </div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);

async function init() {
  try {
    const r = await fetch('/api/ships');
    const d = await r.json();
    $('ship').innerHTML = d.ships.map(s => `<option value="${s.key}">${s.name}（${s.scu} SCU / 箱${s.max_box}）</option>`).join('');
    $('ship').value = d.default_ship;
    $('budget').value = d.budget_default;
    $('system').innerHTML = d.systems.map(s => `<option value="${s.id}"${s.id==='68'?' selected':''}>${s.name}</option>`).join('');
    $('status').textContent = '选好参数点「检索路线」。';
  } catch (e) {
    $('status').className = 'status err';
    $('status').textContent = '船型载入失败：' + e;
  }
}

$('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const q = new URLSearchParams({
    ship: $('ship').value,
    budget: $('budget').value,
    stops: $('stops').value,
    system: $('system').value,
    scale: $('scale').value,
    mixed: $('mixed').checked ? 1 : 0,
    auto: $('auto').checked ? 1 : 0,
  });
  $('go').disabled = true;
  $('status').className = 'status';
  $('status').textContent = '检索中…（拉全市场价 + 搜索闭环 + 渲染，约 20–40 秒）';
  $('card').style.display = 'none';
  try {
    const r = await fetch('/api/route?' + q);
    const d = await r.json();
    if (!d.ok) {
      $('status').className = 'status err';
      $('status').textContent = '失败：' + (d.error || '未知');
      return;
    }
    const p = d.params;
    $('meta').textContent = `船 ${p.ship} · 预算 ${p.budget.toLocaleString()} · ${p.stops} 角 · 星系 ${p.system}${p.mixed ? ' · 混装' : ''}${p.auto ? ' · 仅自动装载' : ''} · ${p.scale}x`;
    $('img').src = d.png;
    $('md').textContent = d.md || '';
    $('card').style.display = 'block';
    $('status').textContent = '完成。';
  } catch (e) {
    $('status').className = 'status err';
    $('status').textContent = '请求失败：' + e;
  } finally {
    $('go').disabled = false;
  }
});

$('toggle').addEventListener('click', () => {
  const m = $('md');
  const show = m.style.display !== 'block';
  m.style.display = show ? 'block' : 'none';
  $('toggle').textContent = show ? '隐藏 Markdown 表格' : '显示 Markdown 表格';
});

init();
</script>

<!doctype html>
<meta charset="utf-8">
<title>SC 跑商路线 · 多角闭环检索</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#0e1116; color:#e6edf3; }
  header { padding:20px 28px; border-bottom:1px solid #232c38; }
  header h1 { margin:0; font-size:18px; color:#f0b429; font-weight:600; }
  header p { margin:6px 0 0; font-size:12.5px; color:#7d8b9b; }
  .wrap { display:flex; gap:24px; padding:24px 28px 40px; align-items:flex-start; }
  form { width:340px; flex:none; background:#151b23; border:1px solid #232c38; border-radius:10px; padding:18px; }
  .row { margin-bottom:14px; }
  label.lbl { display:block; font-size:12px; color:#9fb0c3; margin-bottom:5px; }
  select, input[type=number] { width:100%; box-sizing:border-box; background:#0e1116; color:#e6edf3; border:1px solid #2a3441; border-radius:6px; padding:8px 10px; font-size:13px; }
  .checks { display:flex; flex-wrap:wrap; gap:8px 14px; }
  .checks label { display:flex; align-items:center; gap:6px; color:#c9d6e3; font-size:12.5px; margin:0; cursor:pointer; }
  input[type=checkbox] { width:15px; height:15px; accent-color:#f0b429; }
  .btns { display:flex; gap:10px; margin-top:6px; }
  button { border:0; border-radius:6px; padding:10px; font-size:13.5px; font-weight:600; cursor:pointer; }
  #go { flex:1; background:#f0b429; color:#1a1206; }
  #reset { background:#2a3441; color:#c9d6e3; font-weight:500; }
  button:disabled { opacity:.6; cursor:default; }
  .hint { font-size:11px; color:#6b7a8c; margin-top:8px; line-height:1.6; }
  main { flex:1; min-width:0; }
  .status { font-size:13px; color:#9fb0c3; margin-bottom:12px; }
  .status.err { color:#f85149; }

  table.rtable { border-collapse:collapse; width:100%; font-size:12.5px; background:#151b23;
                 border:1px solid #232c38; border-radius:10px; overflow:hidden; }
  table.rtable th { background:#1c2430; color:#9fb0c3; text-align:left; padding:9px 10px;
                    border-bottom:1px solid #2a3441; font-weight:600; white-space:nowrap; }
  table.rtable th.sortable { cursor:pointer; user-select:none; }
  table.rtable th.sortable:hover { color:#f0b429; }
  table.rtable th .arrow { color:#f0b429; font-size:10px; margin-left:3px; }
  table.rtable td { padding:8px 10px; border-bottom:1px solid #1c2430; vertical-align:top; }
  table.rtable tr:last-child td { border-bottom:0; }
  table.rtable td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  table.rtable td.route { color:#7d8b9b; line-height:1.5; }
  table.rtable td.acts { white-space:nowrap; }
  table.rtable td.acts button { background:#1f2937; color:#c9d6e3; font-size:12px; font-weight:500;
                                padding:6px 10px; margin-right:6px; }
  table.rtable td.acts button:hover { background:#26313f; }
  tr.detail > td { background:#10161d; padding:0 12px 14px; }
  .panel { margin-top:8px; }
  .panel table { border-collapse:collapse; width:100%; font-size:12px; margin-bottom:12px; }
  .panel th { background:#1c2430; color:#c9d6e3; text-align:left; padding:8px 9px; border:1px solid #2a3441; font-weight:600; }
  .panel td { padding:7px 9px; border:1px solid #232c38; vertical-align:top; line-height:1.55; }
  .panel h3 { font-size:14px; color:#f0b429; margin:0 0 8px; font-weight:600; }
  .panel p { font-size:12px; color:#9fb0c3; margin:0 0 10px; line-height:1.6; }
  .panel strong { color:#7ee787; }
  .panel img { max-width:100%; height:auto; border-radius:8px; display:block; }
  .dl { display:inline-block; margin-top:10px; background:#f0b429; color:#1a1206; border-radius:6px; padding:8px 14px; font-size:12.5px; font-weight:600; text-decoration:none; }
</style>
<header>
  <h1>SC 跑商路线 · 多角闭环检索</h1>
  <p>选船 / 预算 / 角数 → 出表格；点表头可随时改排序，点 Detail 看明细，点「生成图片」出 PNG</p>
</header>
<div class="wrap">
  <form id="f">
    <div class="row">
      <label class="lbl" for="ship">船型</label>
      <select id="ship"></select>
    </div>
    <div class="row">
      <label class="lbl" for="budget">预算 (aUEC)</label>
      <input type="number" id="budget" step="100000" min="0">
    </div>
    <div class="row">
      <label class="lbl">角数（可多选）</label>
      <div class="checks" id="stops"></div>
    </div>
    <div class="row">
      <label class="lbl" for="system">星系</label>
      <select id="system"></select>
    </div>
    <div class="row">
      <label class="lbl" for="top">每个角数出几条</label>
      <select id="top"><option>1</option><option selected>2</option><option>3</option></select>
    </div>
    <div class="row checks">
      <label><input type="checkbox" id="mixed" checked> 混装填满货舱</label>
      <label><input type="checkbox" id="auto" checked> 仅自动装载站点</label>
    </div>
    <div class="row">
      <label class="lbl" for="scale">图片分辨率（生成时生效）</label>
      <select id="scale">
        <option value="2">2x</option><option value="3">3x</option><option value="4" selected>4x</option>
      </select>
    </div>
    <div class="btns">
      <button id="go" type="submit">检索路线</button>
      <button id="reset" type="button">Reset</button>
    </div>
    <div class="hint">排序不在这里选 —— 结果出来后点表头随时改。检索只跑搜索、不渲染图片；点「生成图片」才按需出图。</div>
  </form>

  <main>
    <div class="status" id="status">载入船型…</div>
    <div id="results"></div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
let DEFAULTS = null;
let ROWS = [];                       // 当前结果集（排序只改渲染顺序，不重新查询）
let SORT = { key: 'hourly', dir: -1 };   // -1 降序 / 1 升序

const COLS = [
  { key: 'stops',  label: '角数',   num: true },
  { key: 'profit', label: '圈利润', num: true },
  { key: 'time',   label: '圈时间', num: true },
  { key: 'hourly', label: '时薪',   num: true },
  { key: 'route',  label: '路线',   num: false },
];

function mdToHtml(md) {
  const lines = md.split('\n');
  // 转义 < > 防止地名里的尖括号破格；商品列靠裸 <br> 分行，转义后再还原
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const cell = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/&lt;br\s*\/?&gt;/g, '<br>');
  let out = '';
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (l.startsWith('### ')) {
      out += '<h3>' + cell(l.slice(4)) + '</h3>';
      i++;
      continue;
    }
    if (l.trim().startsWith('|')) {
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith('|')) {
        rows.push(lines[i].trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
        i++;
      }
      const body = rows.filter((r, k) => !(k === 1 && r.every(c => /^[-: ]+$/.test(c))));
      let t = '<table>';
      body.forEach((r, ri) => {
        const tag = ri === 0 ? 'th' : 'td';
        t += '<tr>' + r.map(c => '<' + tag + '>' + cell(c) + '</' + tag + '>').join('') + '</tr>';
      });
      out += t + '</table>';
      continue;
    }
    if (l.trim()) {
      out += '<p>' + cell(l.trim()) + '</p>';
    }
    i++;
  }
  return out;
}

const fmtNum = v => (typeof v === 'number' ? v.toLocaleString() : String(v));

function sortedRows() {
  const col = COLS.find(c => c.key === SORT.key);
  const rows = ROWS.slice();
  if (!col || !col.num) {
    rows.sort((a, b) => String(a[SORT.key]).localeCompare(String(b[SORT.key])) * SORT.dir);
  } else {
    rows.sort((a, b) => (a[SORT.key] - b[SORT.key]) * SORT.dir);
  }
  return rows;
}

function renderTable() {
  const box = $('results');
  box.innerHTML = '';
  if (!ROWS.length) {
    return;
  }
  const table = document.createElement('table');
  table.className = 'rtable';

  const thead = document.createElement('thead');
  const htr = document.createElement('tr');
  COLS.forEach(col => {
    const th = document.createElement('th');
    if (col.num) {
      th.className = 'sortable';
      th.dataset.key = col.key;
      const arrow = SORT.key === col.key ? (SORT.dir === -1 ? '▼' : '▲') : '';
      th.innerHTML = col.label + (arrow ? ' <span class="arrow">' + arrow + '</span>' : '');
      th.addEventListener('click', () => {
        if (SORT.key === col.key) {
          SORT.dir = -SORT.dir;
        } else {
          SORT.key = col.key;
          SORT.dir = (col.key === 'time' || col.key === 'stops') ? 1 : -1;
        }
        renderTable();
      });
    } else {
      th.textContent = col.label;
    }
    htr.appendChild(th);
  });
  const thAct = document.createElement('th');
  thAct.textContent = '操作';
  htr.appendChild(thAct);
  thead.appendChild(htr);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  sortedRows().forEach(r => {
    const tr = document.createElement('tr');
    COLS.forEach(col => {
      const td = document.createElement('td');
      if (col.num) {
        td.className = 'num';
        td.textContent = fmtNum(r[col.key]);
      } else if (col.key === 'route') {
        td.className = 'route';
        td.textContent = r.route || r.title;
      }
      tr.appendChild(td);
    });
    const tdAct = document.createElement('td');
    tdAct.className = 'acts';
    if (r.md) {
      const bd = document.createElement('button');
      bd.textContent = r.open ? '收起 Detail' : 'Detail';
      bd.addEventListener('click', () => {
        r.open = !r.open;
        renderTable();
      });
      tdAct.appendChild(bd);
    }
    if (r.key) {
      const bp = document.createElement('button');
      bp.textContent = r.pngHtml ? '收起图片' : '生成图片';
      bp.addEventListener('click', () => {
        if (r.pngHtml) {
          r.showPng = !r.showPng;
          renderTable();
          return;
        }
        bp.disabled = true;
        bp.textContent = '生成中…';
        fetch('/api/png?key=' + encodeURIComponent(r.key) + '&scale=' + $('scale').value)
          .then(res => res.json())
          .then(g => {
            if (!g.ok) {
              alert('生成失败：' + (g.error || ''));
              bp.textContent = '生成图片';
              return;
            }
            r.pngHtml = '<img src="' + g.png + '" alt="路线图">'
              + '<a class="dl" href="' + g.png + '" download="route_' + r.stops + 'leg_' + r.idx + '.png">下载 PNG</a>';
            r.showPng = true;
            renderTable();
          })
          .catch(err => {
            alert('生成失败：' + err);
            bp.textContent = '生成图片';
          })
          .finally(() => {
            bp.disabled = false;
          });
      });
      tdAct.appendChild(bp);
    }
    tr.appendChild(tdAct);
    tbody.appendChild(tr);

    if (r.open || (r.pngHtml && r.showPng)) {
      const dtr = document.createElement('tr');
      dtr.className = 'detail';
      const dtd = document.createElement('td');
      dtd.colSpan = COLS.length + 1;
      const panel = document.createElement('div');
      panel.className = 'panel';
      if (r.open) {
        if (!r.mdHtml) {
          r.mdHtml = mdToHtml(r.md);
        }
        panel.innerHTML += r.mdHtml;
      }
      if (r.pngHtml && r.showPng) {
        panel.innerHTML += r.pngHtml;
      }
      dtd.appendChild(panel);
      dtr.appendChild(dtd);
      tbody.appendChild(dtr);
    }
  });
  table.appendChild(tbody);
  box.appendChild(table);
}

async function init() {
  try {
    const d = await (await fetch('/api/ships')).json();
    $('ship').innerHTML = d.ships.map(s =>
      '<option value="' + s.key + '">' + s.name + '（' + s.scu + ' SCU / 箱' + s.max_box + '）</option>').join('');
    $('ship').value = d.default_ship;
    $('budget').value = d.budget_default;
    $('system').innerHTML = d.systems.map(s =>
      '<option value="' + s.id + '"' + (s.id === '68' ? ' selected' : '') + '>' + s.name + '</option>').join('');
    $('stops').innerHTML = d.stops.map(n =>
      '<label><input type="checkbox" class="stops" value="' + n + '"' +
      (n === 3 || n === 5 ? ' checked' : '') + '> ' + n + ' 角</label>').join('');
    DEFAULTS = { ship: $('ship').value, budget: $('budget').value, system: $('system').value,
                 top: '2', mixed: true, auto: true, scale: '4', stops: [3, 5] };
    $('status').textContent = '选好参数点「检索路线」；想重来点 Reset。';
  } catch (e) {
    $('status').className = 'status err';
    $('status').textContent = '船型载入失败：' + e;
  }
}

$('reset').addEventListener('click', () => {
  if (!DEFAULTS) {
    return;
  }
  $('ship').value = DEFAULTS.ship;
  $('budget').value = DEFAULTS.budget;
  $('system').value = DEFAULTS.system;
  $('top').value = DEFAULTS.top;
  $('scale').value = DEFAULTS.scale;
  $('mixed').checked = DEFAULTS.mixed;
  $('auto').checked = DEFAULTS.auto;
  document.querySelectorAll('.stops').forEach(c => { c.checked = DEFAULTS.stops.includes(+c.value); });
  ROWS = [];
  $('results').innerHTML = '';
  $('status').className = 'status';
  $('status').textContent = '已重置为默认参数（3 角 + 5 角，各 2 条），可以重新检索。';
});

$('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const stops = [...document.querySelectorAll('.stops:checked')].map(c => c.value);
  if (!stops.length) {
    $('status').className = 'status err';
    $('status').textContent = '至少选一个角数。';
    return;
  }
  const q = new URLSearchParams({
    ship: $('ship').value, budget: $('budget').value, stops: stops.join(','),
    system: $('system').value, top: $('top').value,
    mixed: $('mixed').checked ? 1 : 0, auto: $('auto').checked ? 1 : 0,
  });
  $('go').disabled = true;
  $('status').className = 'status';
  $('status').textContent = '检索中…（角数 ' + stops.join('/') + '，每个 ' + $('top').value + ' 条）';
  $('results').innerHTML = '';
  try {
    const d = await (await fetch('/api/routes?' + q)).json();
    $('go').disabled = false;
    if (!d.ok) {
      $('status').className = 'status err';
      $('status').textContent = '失败：' + (d.error || '未知');
      return;
    }
    const p = d.params;
    ROWS = d.results.map(r => ({
      stops: r.stops, idx: r.idx, title: r.title, key: r.key, md: r.md,
      route: r.route, profit: r.profit, time: r.time, hourly: r.hourly,
      open: false, showPng: false, mdHtml: null, pngHtml: null,
    }));
    renderTable();
    $('status').className = 'status';
    $('status').textContent = '完成：' + ROWS.length + ' 条候选（' + p.ship + ' · '
      + Number(p.budget).toLocaleString() + ' · 角数 ' + p.stops.join('/') + '）· 点表头改排序';
  } catch (e) {
    $('go').disabled = false;
    $('status').className = 'status err';
    $('status').textContent = '请求失败：' + e;
  }
});

init();
</script>
